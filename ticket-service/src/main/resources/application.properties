# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=smartsupport-ticket-service

# ─── Database (MySQL) ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/smartsupport_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ─── AI Classifier Microservice ────────────────────────────────────────────────
ai.classifier.url=http://localhost:5000

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.smartsupport=DEBUG
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── Actuator (health/metrics) ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
