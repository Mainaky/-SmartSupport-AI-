services:
  mysql:
    image: mysql:8.0
    container_name: smartsupport-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartsupport_db}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smartsupport-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartsupport-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smartsupport-kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-9090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  mailhog:
    image: mailhog/mailhog:latest
    container_name: smartsupport-mailhog
    ports:
      - "1025:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  ai-classifier:
    build: ./ai-classifier
    container_name: smartsupport-ai
    ports:
      - "${AI_CLASSIFIER_PORT:-5000}:5000"

  ticket-service:
    build: ./ticket-service
    container_name: smartsupport-ticket-service
    ports:
      - "${TICKET_SERVICE_PORT:-8080}:8080"
    depends_on:
      - mysql
      - kafka
      - ai-classifier
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smartsupport_db}?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_CLASSIFIER_URL: http://ai-classifier:5000

  notification-service:
    build: ./notification-service
    container_name: smartsupport-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8081}:8081"
    depends_on:
      - kafka
      - mailhog
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025

volumes:
  mysql_data: